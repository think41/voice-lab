[project]
name = "voicelab-server"
version = "0.1.0"
description = "FastAPI backend for VoiceLab"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.17.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.1",
    "sqlalchemy[asyncio]>=2.0.36",
    "uvicorn[standard]>=0.32.0",
    "websockets>=15.0.0",
    # Pin pipecat-adk to a specific commit — HEAD moves and API can shift.
    "pipecat-adk @ git+https://github.com/think41/pipecat-adk.git@f777961d9c6ab1385b4d3dac52f0c1919708494b",
    # Cap pipecat-ai major to prevent silent breaking updates.
    "pipecat-ai[deepgram]>=1.3.0,<2",
    # Declare ADK/genai explicitly instead of relying on pipecat-adk transitives.
    "google-adk>=2.2.0,<3",
    "google-genai>=2.8.0,<3",
    # LiteLLM backs ADK's openai/... and anthropic/... model-id resolution.
    "litellm>=1.70,<1.90",
]
[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.8.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
