services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: voicelab
      POSTGRES_USER: voicelab
      POSTGRES_PASSWORD: voicelab
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voicelab -d voicelab"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
