services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: voicelab
      POSTGRES_USER: voicelab
      POSTGRES_PASSWORD: voicelab
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voicelab -d voicelab"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@voicelab.dev
      PGADMIN_DEFAULT_PASSWORD: voicelab
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  pgadmin_data:
